<!-- 
Create a webpage that demonstrates the CSS Box Model. Design multiple <div> elements and apply margin, padding, border, 
width, and height properties to each element. Use different border styles and border radius values. Show the difference 
between box-sizing: content-box and box-sizing: border-box by applying them to different elements. Ensure proper spacing 
between elements so that the effect of each box model property is clearly visible.
 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: aliceblue;
            /* overflow: auto; */
        }
        h1{
            text-align: center;
            padding:20px;
        }
        .container{
            display:flex;
            justify-content: center;
            gap:70px;
        }
       
        .content-box{
            box-sizing: content-box;
            border: 8px solid green;
            background-color: lightblue;
            height: 150px;
            width: 200px;
            text-align: center;
            padding: 20px;
        }
      
        .border-box{
            box-sizing: border-box;
            border: 8px dashed red;
            border-radius: 20px;
            padding:30px;
            text-align: center;
        }
          .description{
            padding: 25px;
            text-align: center;
        }
        .dotted-border{
            box-sizing: content-box;
            border: 8px dotted green;
            text-align: center;
            padding: 20px;
            
        }

    </style>
</head>
<body>
    <h1>Box Model</h1>
    <div class="container">

    <div class="content-box">Content Box
        <div class="description">
            box-sizing:content-ox<br>
            width and height include padding and border.
        </div>
    </div>

    <div class="border-box">Border Box
        <div class="description">
            box-sizing:border-box<br>
            width and height include padding and border.
        </div>
    </div>
    
    <div class="dotted-border">
        <div class="description">
            Dotted border style<br>
        </div>
    </div>

    </div>
</body>
</html>
