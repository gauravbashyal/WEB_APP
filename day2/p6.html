<!-- Create a webpage that demonstrates advanced CSS features. Use pseudo-classes such as hover, focus, and active, 
 and pseudo-elements such as before and after. Apply CSS transitions, transforms, and animations using keyframes. 
 Use CSS variables to define common colors and apply media queries to make the webpage responsive for different screen sizes.
 --><!DOCTYPE html>
<html>
<head>
<title>Simple CSS Demo</title>

<style>
body {
    font-family: Arial;
    background-color: #f0f0f0;
    text-align: center;
    padding: 20px;
}
h1 {
    font-size: 28px;
}
h1::after {
    content: "";
    display: block;
    width: 80px;
    height: 3px;
    background-color: blue;
    margin: 10px auto;
}
button {
    padding: 10px 20px;
    font-size: 16px;
    background-color: blue;
    color: white;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background-color: red;
}
button:active {
    transform: scale(0.9);
}
input {
    padding: 8px;
    font-size: 16px;
    margin-top: 15px;
}
input:focus {
    border: 2px solid red;
}
.box {
    width: 100px;
    height: 100px;
    background-color: green;
    margin: 30px auto;
    animation: moveBox 3s infinite alternate;
}

@keyframes moveBox {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(100px);
    }
}

</style>
</head>

<body>

<h1>Simple CSS Example</h1>

<button>Click Me</button>
<br><br>
<input type="text" placeholder="Type here">

<div class="box"></div>

</body>
</html>
