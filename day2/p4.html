<!-- Design a responsive webpage layout using CSS Flexbox. Create a container with multiple items and apply flexbox 
 properties such as flex-direction, justify-content, align-items and flex-wrap. Demonstrate the use of flex-grow, 
 flex-shrink and flex-basis on flex items. Use flexbox to design a navigation bar and a card-style layout that adjusts 
 properly on different screen sizes.
 -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial,sans-serif;
        }
        body{
            background: white;
        }
        .navbar{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            background: black;
            /* padding: 1rem 2rem; */
            padding: 18px;
            color: white;
        }
        .logo{
            display: flex;
            flex-direction: row;
        }
        .nav-links{
            display: flex;
            flex-direction: row;
            gap: 20px;
        }
        .nav-links a{
            color: white;
            text-decoration: none;
        }

        .container{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            padding: 40px;
        }

        .card{
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 300px;
            max-width: 350px;
        }

        .card h3{
            margin-bottom: 10px;
        }
        .card p{
            margin-bottom: 20px;
        }
        .card button{
            padding: 10px;
            border: none;
            background: lightblue;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        @media (max-width: 768px){
            .navbar{
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .logo{
                padding-bottom: 10px;
            }
             .nav-links{
                flex-direction: column;
                width: 100%;
            }
            
            .container{
                flex-direction: column;
                align-items: center;
            }
            
            .card{
                width: 90%;
                max-width: 100%;
            }
        }

    </style>
 </head>
 <body>
    <nav class="navbar">
        <div class="logo">MyFlexSite</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
        </nav>
        <div class="container">
            <div class="card">
                <h3>Card One</h3>
                <p>This card demonstrates flex-grow,flex-shrink and flex-basis properties</p>
                <button>Read More</button>
            </div>

            <div class="card">
                <h3>Card Two</h3>
                <p>Cards wrap automatically using flex-wrap when the screen size decrease </p>
                <button>Read More</button>
            </div>

            <div class="card">
                <h3>Card Three</h3>
                <p>The layout is fully responsive using flexbox properties.</p>
                <button>Read More</button>
            </div>
        </div>

 </body>
 </html>
