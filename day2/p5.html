<!-- Design a webpage layout using CSS Grid. Create a grid-based structure that includes a header, sidebar, main content area, and footer. 
 Use grid-template-rows, grid-template-columns, gap, grid-row, and grid-column properties to arrange the layout. Ensure the grid layout is clean, 
 well-structured, and responsive.
 -->

 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        body{
            margin: 0;
            font-family: Arial,sans-serif;
        }

        .container{
            display: grid;
            height: 100vh;
            grid-template-rows: 80px 1fr 60px;
            grid-template-columns: 200px 1fr;
            gap: 10px;
            padding: 10px;
        }
        .header{
            background: green;
            color: white;
            text-align: center;
            line-height: 80px;
            grid-column: 1/3;
        }
        .sidebar{
            background:blue;
            color: white;
            padding: 10px;
            grid-row: 2/3;
            grid-column: 1/2;
        }
        .main{
            background: lightgray;
            padding: 10px;
            grid-row: 2/3;
            grid-column: 2/3;
        }
        .footer{
            background: black;
            color: white;
            text-align: center;
            line-height: 60px;
            grid-column: 1/3;
        }
        h2{
            text-align: center;
        }
        
        @media (max-width: 600px){
            .container{
                grid-template-rows: 80px auto 1fr 60px;
                grid-template-columns: 1fr;
            }
            .header, .sidebar, .main, .footer{
                grid-column:1/2
            }
        }

    </style>
 </head>
 <body>
    <div class="container">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="main">
        <h2>Main Content</h2>
        <p>This is the main content.</p>
        </div>
        <div class="footer">Footer</div>
        
    </div>
 </body>
 </html>
