<!-- Create a webpage that includes at least two hyperlinks using the <a> tag.
     One link should open in the same tab and the other should open in a new tab. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lab1 </h1>
    <h2>Task 2</h2>
    <p>Click the links below: </p>
    <!-- This will open the link in same tab -->
    <a href="https://www.google.com" target="_self">(same tab)</a>

    <br><br>

    <!-- this will open the link in new tab -->
    <a href="https://www.google.com" target="_blank">(new tab)</a>
</body>
</html>
